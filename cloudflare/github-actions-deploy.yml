# Deploys the site to Cloudflare Pages: main -> production (archieowenracing.com),
# pull requests -> a preview at <branch>.archie-owen-racing.pages.dev.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./cloudflare/build.sh
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy --branch="${{ github.head_ref || github.ref_name }}" --commit-hash="${{ github.sha }}" --commit-dirty=true
